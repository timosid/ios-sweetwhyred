name: whyred-file-vm-probe
on:
  workflow_dispatch:
  push:
    branches: [codex/whyred-early-fb]
    paths: [.github/workflows/whyred-probe.yml, tools/whyredprobe.c]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Native file probe checks
        run: |
          mkdir -p out/probe
          clang -O1 -Wall -Wextra -Werror tools/whyredprobe.c -o out/probe/whyredprobe-native
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          p=Path('out/probe');data=bytes(range(256))*257;(p/'fixture').write_bytes(data)
          binary=str(p/'whyredprobe-native')
          r=subprocess.run([binary,'file',str(p/'fixture'),'3','16384'],check=True,capture_output=True,text=True)
          h=14695981039346656037
          for c in data[3:3+16384]:h=((h^c)*1099511628211)&((1<<64)-1)
          assert r.stdout.count('fnv1a64=%016x'%h)==2
          for args,code in [(['file',str(p/'fixture'),'0','65537'],2),(['file',str(p/'fixture'),'-1','16'],2),(['file',str(p/'fixture'),'999999','16'],0),(['file',str(p/'absent'),'0','16'],1)]:
              assert subprocess.run([binary,*args],capture_output=True).returncode==code
          (p/'host-test.txt').write_text('PASS direct/mapped byte digest, EOF, missing file, negative and oversized bounds\n')
          (p/'fixture').unlink()
          PY
      - name: Build signed iOS probe
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -target arm64-apple-ios16.4 -isysroot "$SDK" -mcpu=generic+crypto -mno-outline-atomics -O1 -Wall -Wextra -Werror tools/whyredprobe.c -o out/probe/whyredprobe
          cat > out/probe/entitlements.plist <<'PLIST'
          <?xml version="1.0"?><plist version="1.0"><dict><key>task_for_pid-allow</key><true/><key>com.apple.system-task-ports</key><true/></dict></plist>
          PLIST
          codesign --force --sign - --timestamp=none --entitlements out/probe/entitlements.plist out/probe/whyredprobe
          codesign --verify --strict out/probe/whyredprobe
          otool -l out/probe/whyredprobe > out/probe/load-commands.txt
          otool -L out/probe/whyredprobe > out/probe/dependencies.txt
          xcrun llvm-nm -u out/probe/whyredprobe > out/probe/imports.txt
          xcrun llvm-objdump -d out/probe/whyredprobe > out/probe/isa.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,re
          p=Path('out/probe')
          assert re.search(r'platform\s+(?:2|IOS)\b',(p/'load-commands.txt').read_text())
          assert not re.search(r'\b(?:cas[a-z]*|ldadd[a-z]*|swp[a-z]*|stadd[a-z]*)\s+[wx]',(p/'isa.txt').read_text())
          (p/'report.json').write_text(json.dumps({'source':os.environ['GITHUB_SHA'],'sha256':hashlib.sha256((p/'whyredprobe').read_bytes()).hexdigest(),'bytes':(p/'whyredprobe').stat().st_size,'target_writes':False},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: whyred-file-vm-probe
          path: out/probe/
          retention-days: 7
