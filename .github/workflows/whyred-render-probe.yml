name: whyred-render-probe
on:
  workflow_dispatch:
  push:
    branches: [codex/whyred-early-fb]
    paths: [.github/workflows/whyred-render-probe.yml, tools/whyred-render-probe.m]
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Compile native software renderer diagnostic
        run: |
          mkdir -p out/render
          clang -fobjc-arc -O1 -g -Wall -Wextra -Werror tools/whyred-render-probe.m -framework Foundation -framework CoreImage -framework CoreGraphics -framework QuartzCore -framework IOSurface -o out/render/whyred-render-probe-native
      - name: Build signed iOS diagnostic
        run: |
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          clang -target arm64-apple-ios16.4 -isysroot "$SDK" -mcpu=generic+crypto -mno-outline-atomics -fobjc-arc -O1 -g -Wall -Wextra -Werror -Wno-deprecated-declarations tools/whyred-render-probe.m -framework Foundation -framework CoreImage -framework CoreGraphics -framework QuartzCore -framework IOSurface -framework OpenGLES -o out/render/whyred-render-probe
          codesign --force --sign - --timestamp=none out/render/whyred-render-probe
          codesign --verify --strict out/render/whyred-render-probe
          otool -l out/render/whyred-render-probe > out/render/load-commands.txt
          otool -L out/render/whyred-render-probe > out/render/dependencies.txt
          xcrun llvm-objdump -d out/render/whyred-render-probe > out/render/isa.txt
          python3 - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          p=Path('out/render'); b=p/'whyred-render-probe'
          assert re.search(r'platform\s+(?:2|IOS)\b',(p/'load-commands.txt').read_text())
          assert not re.search(r'\b(?:cas[a-z]*|ldadd[a-z]*|swp[a-z]*|stadd[a-z]*)\s+[wx]',(p/'isa.txt').read_text())
          (p/'report.json').write_text(json.dumps({'source':os.environ['GITHUB_SHA'],'sha256':hashlib.sha256(b.read_bytes()).hexdigest(),'bytes':b.stat().st_size,'device_tested':False,'files_written':False,'bitmap_pixels':256},indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: whyred-render-probe
          path: out/render/
          retention-days: 7
